<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKE的书库</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap');
  :root {
    --bg: #F0F7F7;
    --card: rgba(255,255,255,0.75);
    --text: #1A2E2E;
    --text-muted: #6A8A8A;
    --accent: #2A8A8A;
    --accent-light: #C8E8E8;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --blur: blur(12px);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'PingFang SC', 'Noto Sans SC', sans-serif;
    font-weight: 500;
  }
  body {
    background: linear-gradient(135deg, #E8F5F5 0%, #E0F2F2 100%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ========== ✅ 升级：多色高级几何背景 ========== */
  .bg-shape {
    position: fixed;
    z-index: 0;
    border-radius: 28px;
    opacity: 0.35;
  }
  .shape1 {
    width: 140px;
    height: 140px;
    background: #A4D4E4;
    top: 8%;
    left: 4%;
    transform: rotate(18deg);
    border-radius: 40px;
  }
  .shape2 {
    width: 100px;
    height: 100px;
    background: #D8B6E4;
    top: 22%;
    right: 6%;
    border-radius: 50%;
  }
  .shape3 {
    width: 120px;
    height: 120px;
    background: #F8D8D8;
    bottom: 18%;
    left: 8%;
    transform: rotate(-22deg);
  }
  .shape4 {
    width: 80px;
    height: 80px;
    background: #C8E8D8;
    bottom: 28%;
    right: 12%;
    border-radius: 50%;
  }
  .shape5 {
    width: 90px;
    height: 90px;
    background: #FFE4C8;
    top: 45%;
    left: -20px;
    border-radius: 30px;
    transform: rotate(30deg);
  }
  .shape6 {
    width: 70px;
    height: 70px;
    background: #D4F0F0;
    bottom: 5%;
    right: 25%;
    border-radius: 20px;
  }

  /* 顶部导航 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    backdrop-filter: var(--blur);
    padding: 12px 16px;
    border-bottom: 1px solid rgba(200,222,222,0.5);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .topbar-streak {
    background: var(--accent-light);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--accent);
  }

  /* 通用页面容器 */
  .screen {
    display: none;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .screen.active { display: block; }

  /* 首页几何标题栏 */
  .home-header {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 20px;
    padding: 30px 16px;
    margin-bottom: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(200,222,222,0.5);
  }
  .home-header::before, .home-header::after {
    content: '';
    position: absolute;
    background: rgba(200,232,232,0.5);
    border-radius: 12px;
    opacity: 0.5;
  }
  .home-header::before {
    width: 50px;
    height: 50px;
    top: 10px;
    left: 15px;
    transform: rotate(20deg);
  }
  .home-header::after {
    width: 35px;
    height: 35px;
    bottom: 15px;
    right: 20px;
    border-radius: 50%;
  }
  .home-title {
    font-size: 24px;
    font-weight: 600;
    color: var(--accent);
    position: relative;
    z-index: 1;
  }
  .home-desc {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  /* 滑动书架 */
  .bookshelf-container {
    overflow-x: auto;
    padding: 10px 0 20px;
    scroll-snap-type: x mandatory;
  }
  .bookshelf {
    display: flex;
    gap: 16px;
    padding: 0 16px;
  }
  .book-card {
    width: 180px;
    flex-shrink: 0;
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(200,222,222,0.5);
    scroll-snap-align: start;
  }
  .book-cover {
    width: 100%;
    height: 240px;
    object-fit: cover;
  }
  .book-info {
    padding: 12px;
  }
  .book-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .book-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .add-book-card {
    width: 180px;
    height: 320px;
    flex-shrink: 0;
    background: var(--card);
    backdrop-filter: var(--blur);
    border: 2px dashed rgba(200,222,222,0.8);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }
  .add-icon {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .add-text {
    font-size: 14px;
  }

  /* 章节卡片 */
  .chapter-card {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 16px;
    border: 1px solid rgba(200,222,222,0.5);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .chapter-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .chapter-tag {
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 8px;
    background: #a488e4;
  }
  .chapter-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-left: 8px;
  }
  .chapter-header-left {
    display: flex;
    align-items: center;
  }
  .chapter-count {
    font-size: 12px;
    color: var(--text-muted);
  }
  .unit-list {
    padding: 8px 12px;
    display: none;
  }
  .unit-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
  }
  .unit-item:hover {
    background: rgba(240,247,247,0.8);
  }
  .unit-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .unit-sub {
    font-size: 12px;
    color: var(--text-muted);
  }
  .unit-badge {
    background: rgba(240,247,247,0.8);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* 模式选择 */
  .mode-header {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 16px;
    border: 1px solid rgba(200,222,222,0.5);
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-header-icon {
    width: 48px;
    height: 48px;
    background: #D4F0F0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .mode-header h2 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }
  .mode-header p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .mode-card {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 14px;
    border: 1px solid rgba(200,222,222,0.5);
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .mode-card-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .mode-card-icon.study { background: #C8E8E8; }
  .mode-card-icon.read { background: #fff3b0; }
  .mode-card h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .mode-card p {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* 学习页 */
  .progress-area {
    margin-bottom: 14px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: rgba(200,222,222,0.5);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4AA8B8;
    border-radius: 99px;
    transition: width 0.4s;
  }
  .word-card {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 20px;
    border: 1px solid rgba(200,222,222,0.5);
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .word-card-top {
    padding: 20px;
    text-align: center;
  }
  .word-pos-badge {
    display: inline-block;
    background: #D4F0F0;
    color: #2A8A8A;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .word-cn {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .image-zone {
    height: 180px;
    background: rgba(216,238,238,0.5);
    position: relative;
    overflow: hidden;
  }
  .image-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .word-card-bottom {
    padding: 20px;
  }
  .input-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .word-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid rgba(200,222,222,0.5);
    border-radius: 12px;
    background: rgba(240,247,247,0.8);
    margin-bottom: 10px;
    font-size: 16px;
  }
  .submit-btn {
    width: 100%;
    padding: 10px;
    background: #4AA8B8;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .result-row {
    padding: 10px;
    border-radius: 12px;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .result-row.correct {
    background: #D8F0EB;
    color: #3A9E8A;
    display: flex;
  }
  .result-row.wrong {
    background: #FDEAEA;
    color: #C05050;
    display: flex;
  }
  .answer-reveal {
    display: none;
    margin-bottom: 10px;
  }
  .answer-en {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .answer-phonetic {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .answer-sound-btn {
    background: #D4F0F0;
    color: #2A8A8A;
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .example-box {
    background: rgba(228,242,242,0.8);
    border-radius: 12px;
    padding: 12px;
    border-left: 3px solid #4AA8B8;
  }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .action-btn {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    font-weight: 600;
    border: 1px solid rgba(200,222,222,0.5);
    background: var(--card);
    cursor: pointer;
  }
  .action-btn.primary {
    background: #4AA8B8;
    color: #fff;
    border-color: #4AA8B8;
  }

  /* 纯文本阅读页 */
  .read-card {
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 20px;
    border: 1px solid rgba(200,222,222,0.5);
    padding: 20px;
    margin-bottom: 14px;
  }

  /* 弹窗 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    width: 85%;
    max-width: 380px;
    background: var(--card);
    backdrop-filter: var(--blur);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid rgba(200,222,222,0.5);
  }
  .modal-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
    margin-bottom: 16px;
  }
  .modal-input {
    width: 100%;
    padding: 12px;
    border: 1px solid rgba(200,222,222,0.5);
    border-radius: 12px;
    margin-bottom: 20px;
    background: rgba(240,247,247,0.8);
  }
  .modal-btns {
    display: flex;
    gap: 12px;
  }
  .modal-btn {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-cancel { background: rgba(238,238,238,0.8); color: #666; }
  .btn-confirm { background: #4AA8B8; color: #fff; }

  .back-btn {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <!-- 升级：6个彩色几何背景，更丰富高级 -->
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="bg-shape shape4"></div>
  <div class="bg-shape shape5"></div>
  <div class="bg-shape shape6"></div>

  <div class="topbar">
    <div class="topbar-logo">WAKE的书库</div>
    <div class="topbar-streak">连续 <span id="streak-num">0</span> 天</div>
  </div>

  <!-- 书架页 -->
  <div class="screen active" id="screen-bookshelf">
    <div class="home-header">
      <div class="home-title">WAKE的书库</div>
      <div class="home-desc">每天10分钟，轻松背单词</div>
    </div>
    <div class="bookshelf-container">
      <div class="bookshelf" id="bookshelf"></div>
    </div>
  </div>

  <!-- 章节页 -->
  <div class="screen" id="screen-home">
    <div class="back-btn" onclick="showScreen('bookshelf')">← 返回书架</div>
    <div class="section-title">章节列表</div>
    <div id="chapter-list"></div>
  </div>

  <!-- 模式选择页 -->
  <div class="screen" id="screen-mode">
    <div class="back-btn" onclick="showScreen('home')">← 返回</div>
    <div class="mode-header">
      <div class="mode-header-icon">📖</div>
      <div>
        <h2 id="mode-unit-name">Unit 1</h2>
        <p id="mode-unit-sub">In the Morning</p>
      </div>
    </div>
    <div class="mode-card" onclick="startMode('study')">
      <div class="mode-card-icon study">✏️</div>
      <div><h3>看图默写</h3><p>看中文+图片默写，深度记忆</p></div>
    </div>
    <div class="mode-card" onclick="startMode('read')">
      <div class="mode-card-icon read">📖</div>
      <div><h3>纯文本学习</h3><p>离线复习单词+例句</p></div>
    </div>
  </div>

  <!-- 默写学习页 -->
  <div class="screen" id="screen-study">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="progress-area">
      <div class="progress-top">
        <span id="study-progress-label">1 / 20</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="study-progress-fill"></div></div>
    </div>
    <div class="word-card">
      <div class="word-card-top">
        <div class="word-pos-badge" id="study-pos">v.</div>
        <div class="word-cn" id="study-cn">醒来</div>
      </div>
      <div class="image-zone">
        <img id="study-img">
      </div>
      <div class="word-card-bottom">
        <div class="input-label">默写英文：</div>
        <input class="word-input" id="study-input" placeholder="输入单词..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="submit-btn" onclick="checkStudy()">确认</button>
        <div class="result-row" id="study-result"></div>
        <div class="answer-reveal" id="answer-reveal">
          <div class="answer-en" id="answer-en"></div>
          <div class="answer-phonetic" id="answer-phonetic"></div>
          <button class="answer-sound-btn" onclick="speak()">🔊 发音</button>
          <div class="example-box" id="example-box"></div>
        </div>
        <div class="action-row" id="action-row" style="display:none">
          <button class="action-btn primary" onclick="nextStudy()">下一个 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 纯文本阅读页 -->
  <div class="screen" id="screen-read">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="progress-area">
      <div class="progress-top">
        <span id="read-progress-label">1 / 20</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="read-progress-fill"></div></div>
    </div>
    <div class="read-card">
      <div class="read-pos" id="read-pos">v.</div>
      <div class="read-en" id="read-en">wake up</div>
      <div class="read-phonetic" id="read-phonetic">[weɪk ʌp]</div>
      <div class="read-cn" id="read-cn">醒来</div>
      <div class="read-example example-box" id="read-example"></div>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="prevRead()">← 上一个</button>
      <button class="action-btn primary" onclick="nextRead()">下一个 →</button>
    </div>
  </div>

  <!-- 添加新书弹窗 -->
  <div class="modal-mask" id="addModal">
    <div class="modal-box">
      <div class="modal-title">添加新单词书</div>
      <input type="text" class="modal-input" id="newBookName" placeholder="请输入书籍名称">
      <div class="modal-btns">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-confirm" onclick="confirmAddBook()">确定</button>
      </div>
    </div>
  </div>

<script>
// 已导入的 Chapter 1 Unit 1 单词（无 emoji）
const WORDS = [

  { book:"美国人每天说的话", cover:"https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg", chapter:"Chapter 1", unit:"Unit 1", unitTitle:"In the Morning", chapterClass:"ch1", en:"get up", phonetic:"[ɡet ʌp]", pos:"v.", cn:"起床", exEn:"She gets up early to exercise.", exCn:"她早起锻炼。", img:"person getting out of bed" },
  { book:"美国人每天说的话", cover:"https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg", chapter:"Chapter 1", unit:"Unit 1", unitTitle:"In the Morning", chapterClass:"ch1", en:"stretch", phonetic:"[stretʃ]", pos:"v.", cn:"伸展", exEn:"I stretch my arms after waking up.", exCn:"我醒来后伸展手臂。", img:"person stretching arms" },

];

let currentWords = [];
let currentIdx = 0;
let correctCount = 0;
let learnedWords = JSON.parse(localStorage.getItem('learnedWords') || '[]');
let streak = parseInt(localStorage.getItem('streak') || '0');
let selectedBook = null;
let selectedChapterClass = "";

const bookColorClass = ['book-yellow','book-purple','book-blue','book-green'];
let bookList = JSON.parse(localStorage.getItem('wakeBookList')) || [
  { name:'美国人每天说的话', cover:'https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg' }
];

function renderBookShelf(){
  const wrap = document.getElementById('bookshelf');
  let html = '';
  bookList.forEach((item,idx)=>{
    let color = bookColorClass[idx % bookColorClass.length];
    html += `
      <div class="book-card" onclick="openBookPage(${idx})">
        <img class="book-cover" src="${item.cover||''}" alt="${item.name}">
        <div class="book-info">
          <div class="book-title">${item.name}</div>
          <div class="book-desc">Chapter 1 · 20 词</div>
        </div>
      </div>
    `;
  });
  html += `
    <div class="add-book-card" onclick="openModal()">
      <div class="add-icon">+</div>
      <div class="add-text">添加新书</div>
    </div>
  `;
  wrap.innerHTML = html;
}

function openModal(){
  document.getElementById('addModal').style.display = 'flex';
  document.getElementById('newBookName').value = '';
}
function closeModal(){
  document.getElementById('addModal').style.display = 'none';
}

function confirmAddBook(){
  let name = document.getElementById('newBookName').value.trim();
  if(!name){
    alert('请输入书籍名称');
    return;
  }
  bookList.push({ name: name, cover: '' });
  localStorage.setItem('wakeBookList', JSON.stringify(bookList));
  renderBookShelf();
  closeModal();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function openBookPage(idx){
  selectedBook = bookList[idx].name;
  showScreen('home');
  buildHome();
}

function buildHome() {
  document.getElementById('streak-num').textContent = streak;
  const bookListEl = document.getElementById('chapter-list');

  const chapters = {};
  WORDS.filter(w => w.book === selectedBook).forEach(w => {
    if (!chapters[w.chapter]) chapters[w.chapter] = { unitList: {}, class: w.chapterClass };
    if (!chapters[w.chapter].unitList[w.unit]) chapters[w.chapter].unitList[w.unit] = { title: w.unitTitle, words: [] };
    chapters[w.chapter].unitList[w.unit].words.push(w);
  });

  let html = `
  <div class="back-btn" onclick="goBackBookcase()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg> 返回我的书库
  </div>`;
  Object.entries(chapters).forEach(([ch, data]) => {
    const total = Object.values(data.unitList).reduce((s, u) => s + u.words.length, 0);
    html += `<div class="chapter-card">
      <div class="chapter-header ${data.class}" onclick="toggleChapter(this)">
        <div class="chapter-header-left">
          <span class="chapter-tag ${data.class}">${ch}</span>
          <span class="chapter-name">${selectedBook}</span>
        </div>
        <span class="chapter-count">${total} 词</span>
      </div>
      <div class="unit-list" style="display:none">`;
    Object.entries(data.unitList).forEach(([unit, unitData]) => {
      const done = unitData.words.filter(w => learnedWords.includes(w.en)).length;
      html += `<div class="unit-item" onclick="selectUnit('${ch}','${unit}','${data.class}')">
        <div class="unit-left">
          <div>
            <div class="unit-name">${unit}：${unitData.title}</div>
            <div class="unit-sub">${unitData.words.length} 词</div>
          </div>
        </div>
        <span class="unit-badge">${done}/${unitData.words.length}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  bookListEl.innerHTML = html;
}

function goBackBookcase(){
  showScreen('bookshelf');
}

function toggleChapter(el) {
  const content = el.nextElementSibling;
  content.style.display = content.style.display === 'none' ? 'block' : 'none';
}

function selectUnit(chapter, unit, chapterClass) {
  selectedChapterClass = chapterClass;
  const data = WORDS.filter(w => w.chapter === chapter && w.unit === unit);
  document.getElementById('mode-unit-name').textContent = unit;
  document.getElementById('mode-unit-sub').textContent = data[0]?.unitTitle + ' · ' + data.length + ' 词';
  showScreen('mode');
}

function startMode(mode) {
  currentIdx = 0;
  currentWords = WORDS.filter(w => 
    (selectedChapterClass ? w.chapterClass === selectedChapterClass : true) &&
    w.book === selectedBook
  );

  if (mode === 'study') {
    showScreen('study');
    renderStudy();
  } else if (mode === 'read') {
    showScreen('read');
    renderRead();
  }
}

function renderStudy() {
  if (currentIdx >= currentWords.length) { 
    alert('学习完成！');
    showScreen('home');
    return; 
  }
  const w = currentWords[currentIdx];
  document.getElementById('study-pos').textContent = w.pos;
  document.getElementById('study-cn').textContent = w.cn;
  document.getElementById('study-input').value = '';
  document.getElementById('study-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('study-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
  document.getElementById('answer-reveal').style.display = 'none';
  document.getElementById('action-row').style.display = 'none';
  document.getElementById('study-result').style.display = 'none';
  // 图片自动加载
  document.getElementById('study-img').src = `https://source.unsplash.com/random/400x300/?${w.img}`;
}

function checkStudy() {
  const w = currentWords[currentIdx];
  const input = document.getElementById('study-input').value.trim().toLowerCase();
  const correct = input === w.en.toLowerCase();
  const resultEl = document.getElementById('study-result');
  if (correct) {
    correctCount++;
    resultEl.className = 'result-row correct';
    resultEl.innerHTML = '✅ 回答正确！';
    if (!learnedWords.includes(w.en)) { 
      learnedWords.push(w.en); 
      localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); 
    }
  } else {
    resultEl.className = 'result-row wrong';
    resultEl.innerHTML = `❌ 正确答案：${w.en}`;
  }
  resultEl.style.display = 'flex';
  document.getElementById('answer-en').textContent = w.en;
  document.getElementById('answer-phonetic').textContent = w.phonetic;
  document.getElementById('example-box').innerHTML = `<div class="example-en">${w.exEn}</div><div class="example-cn">${w.exCn}</div>`;
  document.getElementById('answer-reveal').style.display = 'block';
  document.getElementById('action-row').style.display = 'flex';
}

function nextStudy() {
  currentIdx++;
  renderStudy();
}

function renderRead() {
  if (currentIdx >= currentWords.length) { 
    alert('学习完成！');
    showScreen('home');
    return; 
  }
  const w = currentWords[currentIdx];
  document.getElementById('read-pos').textContent = w.pos;
  document.getElementById('read-en').textContent = w.en;
  document.getElementById('read-phonetic').textContent = w.phonetic;
  document.getElementById('read-cn').textContent = w.cn;
  document.getElementById('read-example').innerHTML = `
    <div class="example-en">${w.exEn}</div>
    <div class="example-cn">${w.exCn}</div>
  `;
  document.getElementById('read-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('read-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
}

function prevRead() {
  if (currentIdx > 0) {
    currentIdx--;
    renderRead();
  }
}

function nextRead() {
  currentIdx++;
  renderRead();
}

function speak() {
  const w = currentWords[currentIdx];
  const u = new SpeechSynthesisUtterance(w.en);
  u.lang = 'en-GB';
  speechSynthesis.speak(u);
}

// 初始化
renderBookShelf();
buildHome();
</script>
