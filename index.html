<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKE的书库</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  :root {
    --cream: #F0F7F7;
    --warm: #E4F2F2;
    --teal: #2A8A8A;
    --teal-light: #C8E8E8;
    --teal-dark: #1A6666;
    --green: #3A9E8A;
    --green-light: #D8F0EB;
    --red: #C05050;
    --red-light: #FDEAEA;
    --text: #1A2E2E;
    --text-muted: #6A8A8A;
    --border: #C8DEDE;
    --white: #FFFFFF;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);

    --book-yellow: #FFF9C4;
    --book-purple: #F3E5F5;
    --book-blue: #E3F2FD;
    --book-green: #E8F5E9;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
  }
  body {
    background: var(--white);
    color: var(--text);
    min-height: 100vh;
  }

  .chapter-tag.ch1 { background: #e63946; }
  .chapter-header.ch1 { background: #f8edeb; }
  .chapter-tag.ch2 { background: #457b9d; }
  .chapter-header.ch2 { background: #e0fbfc; }
  .chapter-tag.ch3 { background: #1d3557; }
  .chapter-header.ch3 { background: #e9ecef; }
  .chapter-tag.ch4 { background: #7209b7; }
  .chapter-header.ch4 { background: #f3e8ff; }
  .chapter-tag.ch5 { background: #f72585; }
  .chapter-header.ch5 { background: #ffd6e0; }
  .chapter-tag.ch6 { background: #4cc9f0; }
  .chapter-header.ch6 { background: #caf0f8; }
  .chapter-tag.ch7 { background: #560bad; }
  .chapter-header.ch7 { background: #f1e7ff; }
  .chapter-tag.ch8 { background: #e63946; }
  .chapter-header.ch8 { background: #f8edeb; }
  .chapter-tag.ch9 { background: #f72585; }
  .chapter-header.ch9 { background: #ffd6e0; }

  .topbar {
    background: var(--white);
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .topbar-streak {
    background: var(--teal-light);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--teal-dark);
  }

  .screen { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }

  .home-header {
    position: relative;
    padding: 30px 20px;
    border-radius: 20px;
    background: var(--teal-light);
    text-align: center;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .shape1 {
    position: absolute;
    top: 15px; left: 20px;
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
  }
  .shape2 {
    position: absolute;
    bottom: 10px; right: 20px;
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.4);
    border-radius: 8px;
  }
  .home-title {
    position: relative;
    font-size: 24px;
    font-weight: 700;
    color: var(--teal-dark);
    margin-bottom: 6px;
  }
  .home-desc {
    position: relative;
    font-size: 14px;
    color: var(--teal-dark);
    opacity: 0.8;
  }

  .bookshelf-container {
    overflow-x: auto;
    padding: 10px 0 20px;
    scroll-snap-type: x mandatory;
  }
  .bookshelf {
    display: flex;
    gap: 16px;
    padding: 0 16px;
  }
  .book-card {
    width: 180px;
    flex-shrink: 0;
    background: var(--book-yellow);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    scroll-snap-align: start;
    cursor: pointer;
  }
  .book-card.purple { background: var(--book-purple); }
  .book-card.blue { background: var(--book-blue); }
  .book-card.green { background: var(--book-green); }
  .book-cover {
    width: 100%;
    height: 240px;
    object-fit: cover;
  }
  .book-info {
    padding: 12px;
    background: #fff;
  }
  .book-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .book-desc {
    font-size: 12px;
    color: var(--text-muted);
  }

  .add-book-card {
    width: 180px;
    height: 320px;
    flex-shrink: 0;
    border: 2px dashed #ccc;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #888;
    cursor: pointer;
  }
  .add-icon { font-size: 40px; margin-bottom: 8px; }
  .add-text { font-size: 14px; }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .chapter-card {
    background: var(--white);
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .chapter-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .chapter-tag {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .chapter-header-left { display: flex; align-items: center; gap: 8px; }
  .chapter-name { font-size: 15px; font-weight: 700; }
  .chapter-count { font-size: 12px; color: var(--text-muted); }
  .unit-list { padding: 8px 12px; display: none; }
  .unit-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .unit-item:hover { background: var(--cream); }
  .unit-left { display: flex; align-items: center; gap: 10px; }
  .unit-icon {
    width: 36px; height: 36px;
    background: var(--teal-light);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    font-weight: bold;
    color: var(--teal-dark);
  }
  .unit-name { font-size: 14px; font-weight: 500; }
  .unit-sub { font-size: 12px; color: var(--text-muted); }
  .unit-badge {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .mode-header {
    background: var(--white);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-header-icon {
    width: 48px; height: 48px;
    background: var(--teal-light);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .mode-header h2 { font-size: 17px; font-weight: 700; }
  .mode-header p { font-size: 13px; color: var(--text-muted); }
  .mode-card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mode-card:hover { border-color: var(--teal); }
  .mode-card-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .mode-card-icon.study { background: #C8E8E8; }
  .mode-card-icon.read { background: #fff3b0; }
  .mode-card h3 { font-size: 15px; font-weight: 700; }
  .mode-card p { font-size: 12px; color: var(--text-muted); }

  .progress-area { margin-bottom: 14px; }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 99px;
    transition: width 0.4s;
  }

  .word-card {
    background: var(--white);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .word-card-top {
    padding: 20px;
    text-align: center;
  }
  .word-pos-badge {
    display: inline-block;
    background: var(--teal-light);
    color: var(--teal-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .word-cn { font-size: 28px; font-weight: 700; margin-bottom: 6px; }

  .image-box {
    width: 100%;
    height: 200px;
    background: #E8F5F5;
    position: relative;
  }
  .word-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .word-card-bottom { padding: 16px 20px; }
  .input-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .word-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--cream);
    outline: none;
  }
  .submit-btn {
    padding: 10px 18px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .result-row {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    display: none;
    margin-bottom: 10px;
    align-items: center;
    gap: 8px;
  }
  .result-row.correct { background: var(--green-light); color: var(--green); display: flex; }
  .result-row.wrong { background: var(--red-light); color: var(--red); display: flex; }
  .answer-reveal { display: none; margin-bottom: 10px; }
  .answer-reveal.show { display: block; }
  .answer-en { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .answer-phonetic { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .answer-sound-btn {
    background: var(--teal-light);
    color: var(--teal-dark);
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .example-box {
    background: var(--warm);
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 3px solid var(--teal);
  }
  .example-en { font-size: 13px; margin-bottom: 4px; line-height: 1.5; }
  .example-cn { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .action-row { display: flex; gap: 8px; margin-top: 10px; }
  .action-btn {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--white);
  }
  .action-btn.primary { background: var(--teal); color: #fff; border-color: var(--teal); }

  .read-card {
    background: var(--white);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
  }
  .read-pos {
    display: inline-block;
    background: var(--teal-light);
    color: var(--teal-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .read-en { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .read-phonetic { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
  .read-cn { font-size: 18px; margin-bottom: 10px; }
  .read-example { margin-top: 10px; }

  .modal-mask {
    position: fixed; inset:0; background:rgba(0,0,0,0.4);
    display:none; align-items:center; justify-content:center; z-index:999;
  }
  .modal-box {
    width:85%; max-width:380px; background:#fff; border-radius:16px; padding:24px;
  }
  .modal-title { font-size:18px; font-weight:700; text-align:center; margin-bottom:16px; }
  .modal-input { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:20px; }
  .modal-btns { display:flex; gap:12px; }
  .modal-btn { flex:1; padding:11px; border-radius:12px; border:none; cursor:pointer; }
  .btn-cancel { background:#eee; color:#666; }
  .btn-confirm { background:var(--teal); color:#fff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">WAKE的书库</div>
  <div class="topbar-streak">连续 <span id="streak">0</span> 天</div>
</div>

<!-- 主页：几何图形 + 滑动书架 -->
<div class="screen active" id="screen-shelf">
  <div class="home-header">
    <div class="shape1"></div>
    <div class="shape2"></div>
    <div class="home-title">WAKE的书库</div>
    <div class="home-desc">看图背单词，记得更牢</div>
  </div>

  <div class="bookshelf-container">
    <div class="bookshelf" id="bookList">
      <!-- 书本自动渲染 -->
    </div>
  </div>
</div>

<!-- 章节页面 -->
<div class="screen" id="screen-chapter">
  <div class="back-btn" onclick="showScreen('shelf')">← 返回书架</div>
  <div class="section-title">章节列表</div>
  <div id="chapterContainer"></div>
</div>

<!-- 模式选择 -->
<div class="screen" id="screen-mode">
  <div class="back-btn" onclick="showScreen('chapter')">← 返回章节</div>
  <div class="mode-header">
    <div class="mode-header-icon">📖</div>
    <div>
      <h2 id="modeUnit">Unit 1</h2>
      <p id="modeDesc">选择学习模式</p>
    </div>
  </div>
  <div class="mode-card" onclick="startStudy()">
    <div class="mode-card-icon study">✏️</div>
    <div><h3>看图默写</h3><p>图片刺激记忆更深刻</p></div>
  </div>
  <div class="mode-card" onclick="startRead()">
    <div class="mode-card-icon read">📖</div>
    <div><h3>纯文本学习</h3><p>快速复习单词</p></div>
  </div>
</div>

<!-- 看图默写页面（自动配图） -->
<div class="screen" id="screen-study">
  <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
  <div class="progress-area">
    <div class="progress-top">
      <span id="proLabel">1 / 24</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="proBar" style="width:0%"></div></div>
  </div>

  <div class="word-card">
    <div class="word-card-top">
      <div class="word-pos-badge" id="cardPos">n.</div>
      <div class="word-cn" id="cardCn">加载中...</div>
    </div>

    <!-- 自动配图区域 -->
    <div class="image-box">
      <img id="wordImg" class="word-image" alt="">
    </div>

    <div class="word-card-bottom">
      <div class="input-label">请默写英文</div>
      <div class="input-row">
        <input class="word-input" id="inputWord" type="text" placeholder="输入单词">
        <button class="submit-btn" onclick="checkAns()">确认</button>
      </div>
      <div class="result-row" id="result"></div>
      <div class="answer-reveal" id="answer">
        <div class="answer-en" id="ansEn"></div>
        <div class="answer-phonetic" id="ansPhon"></div>
        <button class="answer-sound-btn" onclick="playVoice()">🔊 发音</button>
        <div class="example-box" id="ansEx"></div>
      </div>
      <div class="action-row" style="display:none" id="actionRow">
        <button class="action-btn primary" onclick="nextWord()">下一个 →</button>
      </div>
    </div>
  </div>
</div>

<!-- 纯文本阅读 -->
<div class="screen" id="screen-read">
  <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
  <div class="progress-area">
    <div class="progress-top"><span id="readProLabel">1 / 24</span></div>
    <div class="progress-bar"><div class="progress-fill" id="readProBar" style="width:0%"></div></div>
  </div>
  <div class="read-card">
    <div class="read-pos" id="readPos">n.</div>
    <div class="read-en" id="readEn">加载中...</div>
    <div class="read-phonetic" id="readPhon"></div>
    <div class="read-cn" id="readCn"></div>
    <div class="example-box" id="readEx"></div>
  </div>
  <div class="action-row">
    <button class="action-btn" onclick="prevRead()">← 上一个</button>
    <button class="action-btn primary" onclick="nextRead()">下一个 →</button>
  </div>
</div>

<!-- 完成页 -->
<div class="screen" id="screen-complete">
  <div style="text-align:center; padding:40px 20px;">
    <div style="font-size:60px; margin-bottom:20px;">🎉</div>
    <h2 style="margin-bottom:10px;">学习完成！</h2>
    <button class="action-btn primary" onclick="showScreen('mode')" style="max-width:200px; margin:10px auto;">再练一次</button>
  </div>
</div>

<!-- 添加新书弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal-box">
    <div class="modal-title">添加新单词书</div>
    <input type="text" class="modal-input" id="newBookName" placeholder="输入书名">
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn btn-confirm" onclick="saveNewBook()">确定</button>
    </div>
  </div>
</div>

<script>
// ====================== 你的 Chapter 1 完整单词 + 自动配图关键词 ======================
const WORD_DATA = [
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"stretch", phonetic:"[strɛtʃ]", pos:"v.", cn:"伸展", exEn:"I stretch every morning.", exCn:"我每天早上伸展身体。", imgTag:"stretch exercise" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"pajamas", phonetic:"[pəˈdʒæməz]", pos:"n.", cn:"睡衣裤", exEn:"I wear pajamas to sleep.", exCn:"我穿睡衣睡觉。", imgTag:"pajamas sleep" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"panic", phonetic:"[ˈpænɪk]", pos:"a.", cn:"惊慌的", exEn:"I panic when I’m late.", exCn:"我迟到时会惊慌。", imgTag:"panic stress" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"alarm", phonetic:"[əˈlɑrm]", pos:"n.", cn:"闹钟", exEn:"My alarm wakes me up.", exCn:"闹钟叫醒我。", imgTag:"alarm clock" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"wake up", phonetic:"", pos:"phrase", cn:"起床（醒来）", exEn:"I wake up at 7.", exCn:"我七点醒来。", imgTag:"wake up morning" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"get up", phonetic:"", pos:"phrase", cn:"起床（从床上起来）", exEn:"I get up at 7:30.", exCn:"我七点半起床。", imgTag:"get up bed" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"sleepyhead", phonetic:"[ˈslipɪhɛd]", pos:"n.", cn:"瞌睡虫", exEn:"Get up you sleepyhead!", exCn:"起床了瞌睡虫！", imgTag:"sleepy person" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"sleepy", phonetic:"[ˈslipɪ]", pos:"a.", cn:"想睡的", exEn:"I am sleepy.", exCn:"我很想睡。", imgTag:"sleepy tired" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"oversleep", phonetic:"[ˌoʊvəˈslɪp]", pos:"vi.", cn:"睡过头", exEn:"I overslept today.", exCn:"我今天睡过头了。", imgTag:"oversleep late" },
  { chapter:"Chapter 1", unit:"Unit 1", chapterClass:"ch1", en:"snooze button", phonetic:"", pos:"phrase", cn:"贪睡按钮", exEn:"I hit the snooze button.", exCn:"我按了贪睡钮。", imgTag:"snooze button alarm" }
];

let currentList = [];
let idx = 0;
let bookList = JSON.parse(localStorage.getItem('bookList')||'[]');
if(!bookList.length){
  bookList=[{name:"美国人每天说的话",cover:"https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg"}];
  localStorage.setItem('bookList',JSON.stringify(bookList));
}

// 渲染书架
function renderShelf(){
  const wrap=document.getElementById('bookList');
  let html='';
  bookList.forEach((b,i)=>{
    let color=['yellow','purple','blue','green'][i%4];
    html+=`
    <div class="book-card ${color}" onclick="openBook('${b.name}')">
      <img class="book-cover" src="${b.cover}">
      <div class="book-info">
        <div class="book-title">${b.name}</div>
        <div class="book-desc">Chapter 1</div>
      </div>
    </div>`;
  });
  html+=`
  <div class="add-book-card" onclick="openModal()">
    <div class="add-icon">+</div>
    <div class="add-text">添加新书</div>
