<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美国人每天说的话 </title>
<style>
  :root {
    --cream: #F0F7F7;
    --warm: #E4F2F2;
    --orange: #2A8A8A;
    --orange-light: #C8E8E8;
    --orange-dark: #1A6666;
    --green: #3A9E8A;
    --green-light: #D8F0EB;
    --red: #C05050;
    --red-light: #FDEAEA;
    --text: #1A2E2E;
    --text-muted: #6A8A8A;
    --border: #C8DEDE;
    --white: #FAFEFE;
    --shadow: 0 2px 8px rgba(42,138,138,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: -apple-system, 'Hiragino Sans', 'Noto Sans TC', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* 新增：Chapter 主题色 */
  .chapter-tag.ch1 { background: #e63946; }
  .chapter-header.ch1 { background: #f8edeb; }
  .chapter-tag.ch2 { background: #457b9d; }
  .chapter-header.ch2 { background: #e0fbfc; }
  .chapter-tag.ch3 { background: #1d3557; }
  .chapter-header.ch3 { background: #e9ecef; }
  .chapter-tag.ch4 { background: #7209b7; }
  .chapter-header.ch4 { background: #f3e8ff; }
  .chapter-tag.ch5 { background: #f72585; }
  .chapter-header.ch5 { background: #ffd6e0; }
  .chapter-tag.ch6 { background: #4cc9f0; }
  .chapter-header.ch6 { background: #caf0f8; }
  .chapter-tag.ch7 { background: #560bad; }
  .chapter-header.ch7 { background: #f1e7ff; }
  .chapter-tag.ch8 { background: #e63946; }
  .chapter-header.ch8 { background: #f8edeb; }
  .chapter-tag.ch9 { background: #f72585; }
  .chapter-header.ch9 { background: #ffd6e0; }

  .topbar {
    background: var(--orange);
    padding: 12px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .topbar-logo {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }
  .topbar-streak {
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 13px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .screen { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }

  .home-greeting {
    text-align: center;
    padding: 20px 0 16px;
  }
  .home-greeting h1 { font-size: 22px; font-weight: 700; color: var(--text); }
  .home-greeting p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    border: 1.5px solid var(--border);
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--orange); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .chapter-card {
    background: var(--white);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .chapter-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .chapter-tag {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .chapter-header-left { display: flex; align-items: center; gap: 8px; }
  .chapter-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .chapter-count { font-size: 12px; color: var(--text-muted); }
  .unit-list { padding: 8px 12px; }
  .unit-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .unit-item:hover { background: var(--cream); }
  .unit-left { display: flex; align-items: center; gap: 10px; }
  .unit-icon {
    width: 36px; height: 36px;
    background: var(--orange-light);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .unit-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .unit-sub { font-size: 12px; color: var(--text-muted); }
  .unit-badge {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .mode-header {
    background: var(--white);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mode-header-icon {
    width: 48px; height: 48px;
    background: var(--orange-light);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .mode-header h2 { font-size: 17px; font-weight: 700; }
  .mode-header p { font-size: 13px; color: var(--text-muted); }
  .mode-card {
    background: var(--white);
    border-radius: 14px;
    border: 1.5px solid var(--border);
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.15s;
  }
  .mode-card:hover { border-color: var(--orange); }
  .mode-card-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .mode-card-icon.study { background: #C8E8E8; }
  .mode-card-icon.read { background: #fff3b0; }
  .mode-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .mode-card p { font-size: 12px; color: var(--text-muted); }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 4px 0;
  }

  .progress-area { margin-bottom: 14px; }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--orange);
    border-radius: 99px;
    transition: width 0.4s;
  }

  .word-card {
    background: var(--white);
    border-radius: 20px;
    border: 1.5px solid var(--border);
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .word-card-top {
    padding: 20px 20px 16px;
    text-align: center;
  }
  .word-pos-badge {
    display: inline-block;
    background: var(--orange-light);
    color: var(--orange-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .word-cn { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .word-hint { font-size: 13px; color: var(--text-muted); }

  .image-zone {
    height: 180px;
    background: #D8EEEE;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-top: 1.5px solid var(--border);
    border-bottom: 1.5px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .image-zone img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  .image-zone .img-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
  }
  .image-zone .img-placeholder .big-icon { font-size: 36px; }
  .image-zone .img-placeholder span { font-size: 12px; }

  .word-card-bottom { padding: 16px 20px; }
  .input-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .word-input {
    flex: 1;
    padding: 10px 14px;
    font-size: 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--cream);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  .submit-btn {
    padding: 10px 18px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: var(--orange-dark); }

  .result-row {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    display: none;
    margin-bottom: 10px;
    align-items: center;
    gap: 8px;
  }
  .result-row.correct { background: var(--green-light); color: var(--green); display: flex; }
  .result-row.wrong { background: var(--red-light); color: var(--red); display: flex; }

  .answer-reveal { display: none; margin-bottom: 10px; }
  .answer-reveal.show { display: block; }
  .answer-en { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .answer-phonetic { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  .answer-sound-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-light);
    color: var(--orange-dark);
    border: none;
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .example-box {
    background: var(--warm);
    border-radius: 12px;
    padding: 12px 14px;
    border-left: 3px solid var(--orange);
  }
  .example-en { font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
  .example-cn { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  .action-row { display: flex; gap: 8px; margin-top: 10px; }
  .action-btn {
    flex: 1;
    padding: 11px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--text);
    transition: background 0.15s;
  }
  .action-btn:hover { background: var(--cream); }
  .action-btn.primary { background: var(--orange); color: #fff; border-color: var(--orange); }

  .read-card {
    background: var(--white);
    border-radius: 20px;
    border: 1.5px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
  }
  .read-pos {
    display: inline-block;
    background: var(--orange-light);
    color: var(--orange-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .read-en { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .read-phonetic { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
  .read-cn { font-size: 18px; color: var(--text); margin-bottom: 10px; }
  .read-example { margin-top: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;opacity:0.9"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>美国人每天说的话
  </div>
  <div class="topbar-streak" id="streak-display">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2c0 6-6 8-6 13a6 6 0 0012 0c0-5-6-7-6-13z"/><path d="M12 12c0 3-2 4-2 6a2 2 0 004 0c0-2-2-3-2-6z"/></svg>
    连续 <span id="streak-num">0</span> 天
  </div>
</div>

<div class="screen active" id="screen-home">
  <div class="home-greeting">
    <h1>今天背什么？</h1>
    <p id="today-date"></p>
  </div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">总单词</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-learned">0</div>
      <div class="stat-label">已掌握</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-weak">0</div>
      <div class="stat-label">待加强</div>
    </div>
  </div>

  <div class="section-title" style="display:flex;align-items:center;gap:6px;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    我的书库
  </div>
  <div id="chapter-list"></div>
</div>

<div class="screen" id="screen-mode">
  <div class="back-btn" onclick="showScreen('home')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> 返回
  </div>
  <div class="mode-header">
    <div class="mode-header-icon" id="mode-unit-icon">📖</div>
    <div>
      <h2 id="mode-unit-name">Unit</h2>
      <p id="mode-unit-sub">选择学习模式</p>
    </div>
  </div>
  <div class="mode-card" onclick="startMode('study')">
    <div class="mode-card-icon study">✏️</div>
    <div><h3>看图默写</h3><p>看中文+图片默写，适合深度记忆</p></div>
  </div>
  <div class="mode-card" onclick="startMode('read')">
    <div class="mode-card-icon read">📖</div>
    <div><h3>纯文本学习</h3><p>离线也能看单词+例句，适合路上复习</p></div>
  </div>
</div>

<div class="screen" id="screen-study">
  <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
  <div class="progress-area">
    <div class="progress-top">
      <span id="study-progress-label">1 / 24</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="study-progress-fill" style="width:0%"></div></div>
  </div>

  <div class="word-card">
    <div class="word-card-top">
      <div class="word-pos-badge" id="study-pos">n.</div>
      <div class="word-cn" id="study-cn">加载中...</div>
    </div>
    <div class="image-zone" id="img-zone">
      <div class="img-placeholder" id="img-placeholder"><div class="big-icon">🖼️</div><span>点击生成图片</span></div>
      <img id="study-img" alt="" style="display:none;" />
    </div>
    <div class="word-card-bottom">
      <div class="input-label">默写英文：</div>
      <div class="input-row">
        <input class="word-input" id="study-input" type="text" placeholder="输入单词..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="submit-btn" onclick="checkStudy()">确认</button>
      </div>
      <div class="result-row" id="study-result"></div>
      <div class="answer-reveal" id="answer-reveal">
        <div class="answer-en" id="answer-en"></div>
        <div class="answer-phonetic" id="answer-phonetic"></div>
        <button class="answer-sound-btn" onclick="speak()">🔊 发音</button>
        <div class="example-box" id="example-box"></div>
      </div>
      <div class="action-row" id="action-row" style="display:none">
        <button class="action-btn primary" onclick="nextStudy()">下一个 →</button>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screen-read">
  <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
  <div class="progress-area">
    <div class="progress-top">
      <span id="read-progress-label">1 / 24</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="read-progress-fill" style="width:0%"></div></div>
  </div>

  <div class="read-card">
    <div class="read-pos" id="read-pos">n.</div>
    <div class="read-en" id="read-en">加载中...</div>
    <div class="read-phonetic" id="read-phonetic"></div>
    <div class="read-cn" id="read-cn"></div>
    <div class="read-example example-box" id="read-example"></div>
  </div>

  <div class="action-row">
    <button class="action-btn" onclick="prevRead()">← 上一个</button>
    <button class="action-btn primary" onclick="nextRead()">下一个 →</button>
  </div>
</div>

<div class="screen" id="screen-complete">
  <div class="complete-screen">
    <div class="complete-icon" id="complete-icon">🎉</div>
    <h2 id="complete-title">完成！</h2>
    <p id="complete-msg"></p>
    <div class="complete-stats stats-row">
      <div class="stat-card"><div class="stat-num" id="c-correct">0</div><div class="stat-label">答对</div></div>
      <div class="stat-card"><div class="stat-num" id="c-wrong">0</div><div class="stat-label">答错</div></div>
    </div>
    <button class="big-btn" onclick="showScreen('mode')">再练一次</button>
    <button class="big-btn outline" onclick="showScreen('home')">返回首页</button>
  </div>
</div>

<script>
// 已适配完整目录的词库结构
const WORDS = [
  // Chapter 1 示例
  { 
    book:"美国人每天说的话",
    cover:"https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg",
    chapter:"Chapter 1", 
    unit:"Unit 1", 
    unitTitle:"In the Morning", 
    unitIcon:"🌅",
    chapterClass:"ch1",
    en:"stretch", 
    phonetic:"[strɛtʃ]", 
    pos:"v.", 
    cn:"伸展", 
    exEn:"I stretch every morning.", 
    exCn:"我每天早上伸展身体。", 
    img:"stretch" 
  },
  { 
    book:"美国人每天说的话",
    cover:"https://www.books.com.tw/img/001/075/56/0010755612_bc_01.jpg",
    chapter:"Chapter 1", 
    unit:"Unit 1", 
    unitTitle:"In the Morning", 
    unitIcon:"🌅",
    chapterClass:"ch1",
    en:"alarm", 
    phonetic:"[əˈlɑːm]", 
    pos:"n.", 
    cn:"闹钟", 
    exEn:"My alarm didn’t ring.", 
    exCn:"我的闹钟没响。", 
    img:"alarm clock" 
  }
];

let currentWords = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let weakWords = JSON.parse(localStorage.getItem('weakWords') || '[]');
let learnedWords = JSON.parse(localStorage.getItem('learnedWords') || '[]');
let streak = parseInt(localStorage.getItem('streak') || '0');
let selectedBook = null;
let selectedChapterClass = "";

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function buildHome() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('zh-TW');
  document.getElementById('stat-total').textContent = WORDS.length;
  document.getElementById('stat-learned').textContent = learnedWords.length;
  document.getElementById('stat-weak').textContent = weakWords.length;
  document.getElementById('streak-num').textContent = streak;

  const bookListEl = document.getElementById('chapter-list');

  if (!selectedBook) {
    const books = [...new Map(WORDS.map(w => [w.book, w])).values()];
    let html = '';
    books.forEach(book => {
      const totalWords = WORDS.filter(w => w.book === book.book).length;
      const learnedCount = WORDS.filter(w => w.book === book.book && learnedWords.includes(w.en)).length;
      html += `
      <div class="chapter-card" onclick="openBook('${book.book}')" style="cursor:pointer;">
        <div class="chapter-header" style="align-items:center;gap:12px;">
          <img src="${book.cover}" alt="${book.book}" style="width:48px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">
          <div style="flex:1;">
            <div class="chapter-header-left">
              <span class="chapter-tag ch1">📚</span>
              <span class="chapter-name">${book.book}</span>
            </div>
            <span class="chapter-count">${totalWords} 词 · ${learnedCount} 已掌握</span>
          </div>
        </div>
      </div>`;
    });
    bookListEl.innerHTML = html;
  } else {
    const chapters = {};
    WORDS.filter(w => w.book === selectedBook).forEach(w => {
      if (!chapters[w.chapter]) chapters[w.chapter] = { unitList: {}, class: w.chapterClass };
      if (!chapters[w.chapter].unitList[w.unit]) chapters[w.chapter].unitList[w.unit] = { title: w.unitTitle, icon: w.unitIcon, words: [] };
      chapters[w.chapter].unitList[w.unit].words.push(w);
    });

    let html = `
    <div class="back-btn" onclick="backToBooks()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg> 返回我的书库
    </div>`;
    Object.entries(chapters).forEach(([ch, data]) => {
      const total = Object.values(data.unitList).reduce((s, u) => s + u.words.length, 0);
      html += `<div class="chapter-card">
        <div class="chapter-header ${data.class}" onclick="toggleChapter(this)">
          <div class="chapter-header-left">
            <span class="chapter-tag ${data.class}">${ch}</span>
            <span class="chapter-name">${selectedBook}</span>
          </div>
          <span class="chapter-count">${total} 词</span>
        </div>
        <div class="unit-list" style="display:none">`;
      Object.entries(data.unitList).forEach(([unit, unitData]) => {
        const done = unitData.words.filter(w => learnedWords.includes(w.en)).length;
        html += `<div class="unit-item" onclick="selectUnit('${ch}','${unit}','${data.class}')">
          <div class="unit-left">
            <div class="unit-icon">${unitData.icon}</div>
            <div>
              <div class="unit-name">${unit}：${unitData.title}</div>
              <div class="unit-sub">${unitData.words.length} 词</div>
            </div>
          </div>
          <span class="unit-badge">${done}/${unitData.words.length}</span>
        </div>`;
      });
      html += `</div></div>`;
    });
    bookListEl.innerHTML = html;
  }
}

function openBook(bookName) {
  selectedBook = bookName;
  buildHome();
}

function backToBooks() {
  selectedBook = null;
  buildHome();
}

function toggleChapter(el) {
  const content = el.nextElementSibling;
  content.style.display = content.style.display === 'none' ? 'block' : 'none';
}

function selectUnit(chapter, unit, chapterClass) {
  selectedChapterClass = chapterClass;
  const data = WORDS.filter(w => w.chapter === chapter && w.unit === unit);
  document.getElementById('mode-unit-name').textContent = unit;
  document.getElementById('mode-unit-sub').textContent = data[0]?.unitTitle + ' · ' + data.length + ' 词';
  document.getElementById('mode-unit-icon').textContent = data[0]?.unitIcon || '📖';
  showScreen('mode');
}

function startMode(mode) {
  currentIdx = 0;
  currentMode = mode;
  currentWords = WORDS.filter(w => 
    (selectedChapterClass ? w.chapterClass === selectedChapterClass : true) &&
    w.chapter === document.querySelector('.mode-header h2').textContent.split(':')[0].trim().split(' ')[0] && 
    w.unit === document.querySelector('.mode-header h2').textContent.split('：')[0].trim()
  );

  if (mode === 'study') {
    showScreen('study');
    renderStudy();
  } else if (mode === 'read') {
    showScreen('read');
    renderRead();
  }
}

function renderStudy() {
  if (currentIdx >= currentWords.length) { showComplete(); return; }
  const w = currentWords[currentIdx];
  document.getElementById('study-pos').textContent = w.pos;
  document.getElementById('study-cn').textContent = w.cn;
  document.getElementById('study-input').value = '';
  document.getElementById('study-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('study-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
}

function checkStudy() {
  const w = currentWords[currentIdx];
  const input = document.getElementById('study-input').value.trim().toLowerCase();
  const correct = input === w.en.toLowerCase();
  if (correct) {
    correctCount++;
    if (!learnedWords.includes(w.en)) { learnedWords.push(w.en); localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); }
  } else {
    wrongCount++;
  }
  document.getElementById('answer-en').textContent = w.en;
  document.getElementById('answer-phonetic').textContent = w.phonetic;
  document.getElementById('example-box').innerHTML = `<div class="example-en">${w.exEn}</div><div class="example-cn">${w.exCn}</div>`;
  document.getElementById('answer-reveal').classList.add('show');
  document.getElementById('action-row').style.display = 'flex';
}

function nextStudy() {
  currentIdx++;
  renderStudy();
}

function renderRead() {
  if (currentIdx >= currentWords.length) { showComplete(); return; }
  const w = currentWords[currentIdx];
  document.getElementById('read-pos').textContent = w.pos;
  document.getElementById('read-en').textContent = w.en;
  document.getElementById('read-phonetic').textContent = w.phonetic;
  document.getElementById('read-cn').textContent = w.cn;
  document.getElementById('read-example').innerHTML = `
    <div class="example-en">${w.exEn}</div>
    <div class="example-cn">${w.exCn}</div>
  `;
  document.getElementById('read-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('read-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
}

function prevRead() {
  if (currentIdx > 0) {
    currentIdx--;
    renderRead();
  }
}

function nextRead() {
  currentIdx++;
  renderRead();
}

function showComplete() {
  showScreen('complete');
  buildHome();
}

function speak() {
  const w = currentWords[currentIdx];
  const u = new SpeechSynthesisUtterance(w.en);
  u.lang = 'en-GB';
  speechSynthesis.speak(u);
}

buildHome();
</script>
</body>
</html>
