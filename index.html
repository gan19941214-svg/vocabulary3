<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAKE的图书馆</title>
<style>
  :root {
    /* 核心平替：改为高明度、低饱和度的燕麦色与植物暖灰底色 */
    --bg: #FCFAF2; 
    --card: #FFFFFF;
    --text: #4A4A4A;
    --text-muted: #8C8C8C;
    --accent: #5B9B9B;
    --accent-light: #EEF6F6;
    --shadow: 0 2px 12px rgba(0,0,0,0.015);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 500;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    color: var(--text);
  }

  /* 移除原先杂乱的彩色漂浮气泡，保持纯净秩序感 */
  .bg-shape { display: none; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #FFFFFF;
    padding: 14px 20px;
    border-bottom: 1px solid #EFECE6;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-logo { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 0.5px; }
  .topbar-streak { background: var(--accent-light); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--accent); font-weight: 600; }

  .screen {
    display: none;
    padding: 20px 16px;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .screen.active { display: block; }

  .home-header {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 20px;
    margin-bottom: 24px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid #EFECE6;
  }
  .home-title { font-size: 22px; font-weight: 600; color: #333333; }
  .home-desc { font-size: 13px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.5px; }

  .bookshelf-container { overflow-x: auto; padding: 4px 0 20px; scroll-snap-type: x mandatory; }
  .bookshelf { display: flex; gap: 16px; padding: 0 4px; }
  .book-card { width: 165px; flex-shrink: 0; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid #EFECE6; scroll-snap-align: start; cursor: pointer; }
  .book-cover { width: 100%; height: 220px; object-fit: cover; }
  .book-info { padding: 12px; }
  .book-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .book-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .add-book-card { width: 165px; height: 294px; flex-shrink: 0; background: transparent; border: 2px dashed #DCD8CF; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; }
  .add-icon { font-size: 32px; margin-bottom: 6px; color: #B0A99F; }
  .add-text { font-size: 13px; }

  /* ------------------ 9大章节手账质感色盘 ------------------ */
  .chapter-card.ch1 { --ch-primary: #E98B6D; --ch-light: #FDF0EC; --ch-text: #5A443E; } 
  .chapter-card.ch2 { --ch-primary: #5B9B9B; --ch-light: #EEF6F6; --ch-text: #3D4A4A; } 
  .chapter-card.ch3 { --ch-primary: #8FA499; --ch-light: #F2F6F4; --ch-text: #414A45; } 
  .chapter-card.ch4 { --ch-primary: #A294B0; --ch-light: #F6F3F8; --ch-text: #4A434F; } 
  .chapter-card.ch5 { --ch-primary: #C29B9B; --ch-light: #FAF4F4; --ch-text: #524343; } 
  .chapter-card.ch6 { --ch-primary: #8FA0B0; --ch-light: #F3F6F8; --ch-text: #41474D; } 
  .chapter-card.ch7 { --ch-primary: #B3A38F; --ch-light: #F8F5F1; --ch-text: #4F4841; } 
  .chapter-card.ch8 { --ch-primary: #768793; --ch-light: #F1F4F6; --ch-text: #3A4146; } 
  .chapter-card.ch9 { --ch-primary: #A0B38F; --ch-light: #F5F8F2; --ch-text: #454F3F; } 

  /* 通用兜底章节色盘（当非目标书本时启用） */
  .chapter-card { --ch-primary: #7A8282; --ch-light: #F4F6F6; --ch-text: #434747; background: var(--card); border-radius: 16px; border: 1px solid #EFECE6; box-shadow: var(--shadow); margin-bottom: 24px; overflow: hidden; }
  
  /* 章节通栏大色块区域 */
  .chapter-header { background: var(--ch-light); padding: 16px; flex-direction: column; align-items: flex-start !important; gap: 4px; border-bottom: 1px solid rgba(0,0,0,0.02); }
  .chapter-header-left { display: flex; align-items: center; gap: 8px; width: 100%; }
  .chapter-tag { background: var(--ch-primary) !important; color: #FFFFFF !important; font-size: 11px !important; padding: 2px 8px !important; border-radius: 4px !important; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .chapter-name { color: var(--ch-primary) !important; font-size: 15px !important; font-weight: 600 !important; }
  .chapter-subtext { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* 核心架构重组：卡片内部的无边框网格标签（Grid Tags） */
  .unit-block-box { background: #FFFFFF; border-radius: 12px; padding: 14px 12px; margin-top: 12px; border: 1px solid #F4F2ED; }
  .unit-block-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4A4A4A; margin-bottom: 10px; }
  .unit-idx-dot { width: 16px; height: 16px; background: var(--ch-primary); color: #fff; font-size: 10px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .unit-title-text { color: var(--text-muted); font-size: 12px; font-weight: 500; margin-left: auto; }

  .grid-tags-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-tag-item { background: var(--ch-light); color: var(--ch-text); font-size: 12px; padding: 10px 6px; text-align: center; border-radius: 6px; cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; display: flex; align-items: center; justify-content: center; min-height: 40px; line-height: 1.2; }
  .grid-tag-item:hover { transform: translateY(-1px); filter: brightness(0.97); }
  .grid-tag-done { border-color: var(--ch-primary); position: relative; }
  .grid-tag-done::after { content: '✓'; position: absolute; top: -2px; right: 2px; font-size: 8px; color: var(--ch-primary); font-weight: 900; }

  /* 练习模式界面优化 */
  .mode-header { background: var(--card); border-radius: 16px; border: 1px solid #EFECE6; padding: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
  .mode-header-icon { width: 44px; height: 44px; background: var(--accent-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .mode-header h2 { font-size: 16px; font-weight: 600; color: var(--text); }
  .mode-header p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  
  .mode-card { background: var(--card); border-radius: 14px; border: 1px solid #EFECE6; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .mode-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .mode-card-icon.study { background: #FDF0EC; }
  .mode-card-icon.read { background: #EEF6F6; }
  .mode-card h3 { font-size: 14px; font-weight: 600; color: var(--text); }
  .mode-card p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* 核心学习卡片硬核逻辑 */
  .word-card, .read-card { background: var(--card); border-radius: 16px; border: 1px solid #EFECE6; overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow); }
  .word-card-top { padding: 24px 20px 16px; text-align: center; }
  .word-pos-badge { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
  .word-cn { font-size: 26px; font-weight: 600; color: #333333; }
  .image-zone { height: 170px; background: #FAF9F5; position: relative; overflow: hidden; border-top: 1px solid #F4F2ED; border-bottom: 1px solid #F4F2ED; }
  
  .word-card-bottom { padding: 20px; }
  .word-input { width: 100%; padding: 12px 14px; border: 1px solid #DCD8CF; border-radius: 10px; background: #FCFAF6; margin-bottom: 12px; font-size: 15px; color: var(--text); outline: none; }
  .word-input:focus { border-color: var(--accent); }
  .submit-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
  
  .result-row { padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; align-items: center; gap: 8px; margin-bottom: 12px; }
  .result-row.correct { background: #EEF6F3; color: #417A65; display: flex; }
  .result-row.wrong { background: #FDF0EC; color: #A6523F; display: flex; }
  
  .example-box { background: #FCFAF6; border-radius: 10px; padding: 14px; border-left: 3px solid var(--accent); font-size: 13px; line-height: 1.5; }
  .example-en { font-weight: 600; color: #333333; margin-bottom: 4px; }
  .example-cn { color: var(--text-muted); }

  .action-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 1px solid #DCD8CF; background: #FFFFFF; color: var(--text); cursor: pointer; }
  .action-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 999; }
  .modal-box { width: 85%; max-width: 360px; background: #FFFFFF; border-radius: 14px; padding: 24px; border: 1px solid #EFECE6; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  
  .back-btn { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .back-btn:hover { color: var(--text); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">WAKE的书库</div>
    <div class="topbar-streak">连续 <span id="streak-num">0</span> 天</div>
  </div>

  <div class="screen active" id="screen-bookshelf">
    <div class="home-header">
      <div class="home-title">WAKE的书库</div>
      <div class="home-desc">此人职业生涯就要爆发了</div>
    </div>
    <div class="bookshelf-container">
      <div class="bookshelf" id="bookshelf"></div>
    </div>
  </div>

  <div class="screen" id="screen-home">
    <div id="chapter-list"></div>
  </div>

  <div class="screen" id="screen-mode">
    <div class="back-btn" onclick="showScreen('home')">← 返回目录</div>
    <div class="mode-header">
      <div class="mode-header-icon">📖</div>
      <div>
        <h2 id="mode-unit-name">Unit</h2>
        <p id="mode-unit-sub">Loading...</p>
      </div>
    </div>
    <div class="mode-card" onclick="startMode('study')">
      <div class="mode-card-icon study">✏️</div>
      <div><h3>看图默写</h3><p>看中文+图片默写，深度记忆</p></div>
    </div>
    <div class="mode-card" onclick="startMode('read')">
      <div class="mode-card-icon read">📖</div>
      <div><h3>文本学习</h3><p>单词+图片+例句，全面复习</p></div>
    </div>
  </div>

  <div class="screen" id="screen-study">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="progress-area" style="margin-bottom:14px;">
      <div class="progress-top" style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px;">
        <span id="study-progress-label">1 / 24</span>
      </div>
      <div class="progress-bar" style="height:4px; background:#EFECE6; border-radius:99px; overflow:hidden;"><div class="progress-fill" id="study-progress-fill" style="height:100%; background:var(--accent); width:0%; transition:width 0.3s;"></div></div>
    </div>
    <div class="word-card">
      <div class="word-card-top">
        <div class="word-pos-badge" id="study-pos">n.</div>
        <div class="word-cn" id="study-cn">腮红</div>
      </div>
      <div class="image-zone"></div>
      <div class="word-card-bottom">
        <input class="word-input" id="study-input" placeholder="输入英文单词..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="submit-btn" id="study-submit-btn" onclick="checkStudy()">确认答案</button>
        <div class="result-row" id="study-result"></div>
        
        <div class="answer-reveal" id="answer-reveal" style="display:none; margin-top:14px;">
          <div class="answer-en" id="answer-en" style="font-size:22px; font-weight:700; color:#333;"></div>
          <div class="answer-phonetic" id="answer-phonetic" style="font-size:13px; color:var(--text-muted); margin:4px 0 10px 0;"></div>
          <button class="answer-sound-btn" onclick="speak()" style="background:var(--accent-light); color:var(--accent); border:none; border-radius:6px; padding:4px 12px; font-size:12px; cursor:pointer; margin-bottom:12px; font-weight:600;">🔊 朗读发音</button>
          <div class="example-box" id="example-box"></div>
        </div>
        <div class="action-row" id="action-row" style="display:none; margin-top:14px;">
          <button class="action-btn primary" onclick="nextStudy()">下一个词 →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-read">
    <div class="back-btn" onclick="showScreen('mode')">← 返回</div>
    <div class="progress-area" style="margin-bottom:14px;">
      <div class="progress-top" style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:6px;">
        <span id="read-progress-label">1 / 24</span>
      </div>
      <div class="progress-bar" style="height:4px; background:#EFECE6; border-radius:99px; overflow:hidden;"><div class="progress-fill" id="read-progress-fill" style="height:100%; background:var(--accent); width:0%; transition:width 0.3s;"></div></div>
    </div>
    <div class="read-card">
      <div class="image-zone" id="read-image" style="height:180px; border-top:none;"></div>
      <div style="padding:20px;">
        <div class="word-pos-badge" id="read-pos">n.</div>
        <div class="read-en" id="read-en" style="font-size:24px; font-weight:700; color:#333; margin-top:4px;">blush</div>
        <div class="read-phonetic" id="read-phonetic" style="font-size:13px; color:var(--text-muted); margin:2px 0 12px 0;">[blʌʃ]</div>
        <div class="read-cn" id="read-cn" style="font-size:18px; font-weight:600; color:#4A4A4A; margin-bottom:14px;">腮红</div>
        <div class="read-example example-box" id="read-example"></div>
      </div>
    </div>
    <div class="action-row" style="display:flex; gap:10px;">
      <button class="action-btn" onclick="prevRead()">← 上一个</button>
      <button class="action-btn primary" onclick="nextRead()">下一个 →</button>
    </div>
  </div>

  <div class="modal-mask" id="addModal">
    <div class="modal-box">
      <div class="modal-title" style="font-size:16px; font-weight:600; text-align:center; margin-bottom:14px;">添加新书</div>
      <input type="text" class="modal-input" id="newBookName" placeholder="请输入书籍名称" style="width:100%; padding:10px; border:1px solid #DCD8CF; border-radius:8px; margin-bottom:16px; outline:none;">
      <div class="modal-btns" style="display:flex; gap:10px;">
        <button class="modal-btn btn-cancel" onclick="closeModal()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#ECE9E2; color:#666; font-weight:600; cursor:pointer;">取消</button>
        <button class="modal-btn btn-confirm" onclick="confirmAddBook()" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer;">确定</button>
      </div>
    </div>
  </div>

<script>
const CHAPTER_CLASS_MAP = {
  "Chapter 1": "ch1", "Chapter 2": "ch2", "Chapter 3": "ch3",
  "Chapter 4": "ch4", "Chapter 5": "ch5", "Chapter 6": "ch6",
  "Chapter 7": "ch7", "Chapter 8": "ch8", "Chapter 9": "ch9"
};

const CHAPTER_FULL_NAME = {

  "Chapter 4": "Recreation & Entertainment | 人生爽过·爽过人生",
  "Shopping | 一卡在手，刷遍全球",
  "Chapter 6": "Traveling | 开心出国游",
  "Chapter 7": "Transportation | 一一起出门转一转吧",
  "Chapter 8": "On Campus | 那些年，我们一起啃的书",
  "Chapter 9": "In the Workplace | 一起来当华丽的上班族吧"
};

function getImgKey(word) {
  return word.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}

// 保持你原有的完整数据源不变
const WORDS = [

  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"wake up", phonetic:"[weɪk ʌp]", pos:"v.", cn:"醒来", exEn:"I usually wake up at 7 AM.", exCn:"我通常早上7点醒来。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"get up", phonetic:"[ɡet ʌp]", pos:"v.", cn:"起床", exEn:"She gets up early every day.", exCn:"她每天早起。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"Rise and shine!", phonetic:"[raɪz ənd ʃaɪn]", pos:"phrase", cn:"起床啦！", exEn:"Rise and shine! It’s morning.", exCn:"起床啦！天亮了。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"sleepyhead", phonetic:"[ˈsliːpihed]", pos:"n.", cn:"贪睡鬼", exEn:"Come on, sleepyhead!", exCn:"快点啦，小懒虫！" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"wide awake", phonetic:"[waɪd əˈweɪk]", pos:"phrase", cn:"完全清醒", exEn:"I am wide awake now.", exCn:"我现在完全清醒了。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"sleepy", phonetic:"[ˈsliːpi]", pos:"adj.", cn:"困倦的", exEn:"I feel sleepy early at night.", exCn:"我晚上很早就犯困。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"drowsy", phonetic:"[ˈdraʊzi]", pos:"adj.", cn:"昏昏欲睡的", exEn:"He is drowsy in the morning.", exCn:"他早上昏昏欲睡。" },
  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 1-1", unitTitle:"In the Morning", en:"puffy eyes", phonetic:"[ˈpʌfi aɪz]", pos:"n.", cn:"浮肿眼袋", exEn:"I have puffy eyes after sleeping late.", exCn:"熬夜后我有浮肿眼袋。" },

  { book:"美国人每天说的话", chapter:"Chapter 1", unit:"Unit 2-1", unitTitle:"In the House - Living Room", en:"floor lamp", phonetic:"", pos:"phrase", cn:"落地灯", exEn:"A floor lamp provides soft light at night.", exCn:"落地灯在晚上提供柔和的光线。" }
];

let currentWords = [];
let currentIdx = 0;
let correctCount = 0;
let learnedWords = JSON.parse(localStorage.getItem('learnedWords') || '[]');
let streak = parseInt(localStorage.getItem('streak') || '0');
let selectedBook = null;
let selectedChapterClass = "";
let selectedUnit = ""; 

let bookList = JSON.parse(localStorage.getItem('wakeBookList')) || [
  { name:'美国人每天说的话' }
];

function renderBookShelf(){
  const wrap = document.getElementById('bookshelf');
  let html = '';
  bookList.forEach((item,idx)=>{
    const totalWords = WORDS.filter(w => w.book === item.name).length;
    html += `
      <div class="book-card" onclick="openBookPage(${idx})">
        <img class="book-cover" src="https://cdn.weread.qq.com/outpic/281/3001246281.jpg" alt="封面">
        <div class="book-info">
          <div class="book-title">${item.name}</div>
          <div class="book-desc">${totalWords} 词</div>
        </div>
      </div>
    `;
  });
  html += `
    <div class="add-book-card" onclick="openModal()">
      <div class="add-icon">+</div>
      <div class="add-text">添加新书</div>
    </div>
  `;
  wrap.innerHTML = html;
}

function openModal(){ document.getElementById('addModal').style.display = 'flex'; document.getElementById('newBookName').value = ''; }
function closeModal(){ document.getElementById('addModal').style.display = 'none'; }

function confirmAddBook(){
  let name = document.getElementById('newBookName').value.trim();
  if(!name) { alert('请输入书籍名称'); return; }
  bookList.push({ name: name });
  localStorage.setItem('wakeBookList', JSON.stringify(bookList));
  renderBookShelf();
  closeModal();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function goBackBookcase(){ showScreen('bookshelf'); }

function openBookPage(idx){
  selectedBook = bookList[idx].name;
  showScreen('home');
  buildHome();
}

/* 架构优化核心：重构 buildHome。
  将大分类单元展开，并用三列网格（Grid Tags）完美还原手账排版布局。
*/
function buildHome() {
  document.getElementById('streak-num').textContent = streak;
  const bookListEl = document.getElementById('chapter-list');

  const chapters = {};
  WORDS.filter(w => w.book === selectedBook).forEach(w => {
    if (!chapters[w.chapter]) {
      const chClass = CHAPTER_CLASS_MAP[w.chapter] || "ch1";
      chapters[w.chapter] = { unitList: {}, class: chClass };
    }
    if (!chapters[w.chapter].unitList[w.unit]) {
      chapters[w.chapter].unitList[w.unit] = { title: w.unitTitle, words: [] };
    }
    chapters[w.chapter].unitList[w.unit].words.push(w);
  });

  let html = `
  <div class="back-btn" onclick="goBackBookcase()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align: middle;">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg> 返回我的书库
  </div>`;

  // 判断是否为目标书籍，绑定专属中英文长标题副文本
  const isTargetBook = (selectedBook === "美国人每天说的话");

  Object.entries(chapters).forEach(([ch, data], chIdx) => {
    const subTitleText = isTargetBook ? (CHAPTER_FULL_NAME[ch] || "") : "暂无章节描述";

    html += `
    <div class="chapter-card ${data.class}">
      <div class="chapter-header flex">
        <div class="chapter-header-left">
          <span class="chapter-tag">${ch}</span>
          <span class="chapter-name">${selectedBook}</span>
        </div>
        <div class="chapter-subtext">${subTitleText}</div>
      </div>
      
      <div style="padding: 4px 14px 16px 14px; background: #FFFFFF;">`;

    // 遍历单元：将每个 Unit 独立渲染为细分大方块框
    Object.entries(data.unitList).forEach(([unit, unitData], uIdx) => {
      const unitNumber = uIdx + 1;
      
      html += `
        <div class="unit-block-box">
          <div class="unit-block-title">
            <span class="unit-idx-dot">${unitNumber}</span>
            <span style="font-weight:700;">${unit}</span>
            <span class="unit-title-text">${unitData.title}</span>
          </div>
          
          <div class="grid-tags-container">`;

      // 处理方块细分元素标签逻辑。将单词拆解或按批次生成网格
      const step = 8; 
      const totalWords = unitData.words.length;
      const tagCount = Math.ceil(totalWords / step);

      for (let i = 0; i < tagCount; i++) {
        const start = i * step;
        const end = Math.min(start + step, totalWords);
        const slicedWords = unitData.words.slice(start, end);
        
        // 判定该网格块内的词是否已经全部背完
        const doneCount = slicedWords.filter(w => learnedWords.includes(w.en)).length;
        const isAllDone = (doneCount === slicedWords.length && totalWords > 0);
        const tagClass = isAllDone ? "grid-tag-item grid-tag-done" : "grid-tag-item";

        // 标签命名展示逻辑
        let tagLabel = `第 ${start+1}-${end} 词`;
        if(start + 1 === end) tagLabel = `第 ${end} 词`;

        html += `
          <div class="${tagClass}" onclick="selectUnitBatch('${ch}','${unit}','${data.class}', ${start}, ${end})">
            <div>
              <div style="font-weight:600;">${tagLabel}</div>
              <div style="font-size:10px; opacity:0.6; margin-top:1px;">${doneCount}/${slicedWords.length} 已学</div>
            </div>
          </div>`;
      }

      html += `</div></div>`;
    });

    html += `</div></div>`;
  });
  bookListEl.innerHTML = html;
}

// 颗粒度拆分：点击具体批次标签时的入口分发
let batchStartIdx = 0;
let batchEndIdx = 0;

function selectUnitBatch(chapter, unit, chapterClass, start, end) {
  selectedChapterClass = chapterClass;
  selectedUnit = unit; 
  batchStartIdx = start;
  batchEndIdx = end;

  const fullData = WORDS.filter(w => w.chapter === chapter && w.unit === unit);
  const currentBatchData = fullData.slice(start, end);

  document.getElementById('mode-unit-name').textContent = unit;
  document.getElementById('mode-unit-sub').textContent = fullData[0]?.unitTitle + ` (第${start+1}-${end}词)`;
  showScreen('mode');
}

function startMode(mode) {
  currentIdx = 0;
  // 核心过滤：仅提取选中批次范围内的单词
  const fullUnitWords = WORDS.filter(w => w.book === selectedBook && w.unit === selectedUnit);
  currentWords = fullUnitWords.slice(batchStartIdx, batchEndIdx);

  if (mode === 'study') {
    showScreen('study');
    renderStudy();
  } else if (mode === 'read') {
    showScreen('read');
    renderRead();
  }
}

function renderStudy() {
  if (currentIdx >= currentWords.length) { 
    alert('本组单词练习完成！');
    showScreen('home');
    buildHome(); 
    return; 
  }
  const w = currentWords[currentIdx];
  document.getElementById('study-pos').textContent = w.pos;
  document.getElementById('study-cn').textContent = w.cn;
  document.getElementById('study-input').value = '';
  document.getElementById('study-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('study-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
  document.getElementById('answer-reveal').style.display = 'none';
  document.getElementById('action-row').style.display = 'none';
  document.getElementById('study-result').style.display = 'none';
  document.getElementById('study-submit-btn').style.display = 'block';

  const imgKey = getImgKey(w.en);
  let url = `https://res.cloudinary.com/dcuw9ijyx/image/upload/${imgKey}.jpg`;
  
  const zone = document.querySelector('.image-zone');
  zone.innerHTML = `<img id="study-img" src="${url}" style="width:100%;height:100%;object-fit:contain;display:block;">`;
  
  const imgEl = document.getElementById('study-img');
  imgEl.onerror = function () {
    zone.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--accent);font-size:13px;background:#FCFAF6;">⚠️ 暂无对应图片 (${imgKey}.jpg)</div>`;
  };
}

function checkStudy() {
  const w = currentWords[currentIdx];
  const input = document.getElementById('study-input').value.trim().toLowerCase();
  
  const cleanInput = input.replace(/[!]/g, '');
  const cleanAnswer = w.en.toLowerCase().replace(/[!]/g, '');
  
  const correct = cleanInput === cleanAnswer;
  const resultEl = document.getElementById('study-result');
  
  if (correct) {
    correctCount++;
    resultEl.className = 'result-row correct';
    resultEl.innerHTML = '<span>✅ 回答正确！精准无误。</span>';
    if (!learnedWords.includes(w.en)) { 
      learnedWords.push(w.en); 
      localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); 
    }
  } else {
    resultEl.className = 'result-row wrong';
    resultEl.innerHTML = `<span>❌ 拼写有误。正确：<b>${w.en}</b></span>`;
  }
  
  resultEl.style.display = 'flex';
  document.getElementById('study-submit-btn').style.display = 'none';
  document.getElementById('answer-en').textContent = w.en;
  document.getElementById('answer-phonetic').textContent = w.phonetic || '(暂无音标)';
  document.getElementById('example-box').innerHTML = `<div class="example-en">${w.exEn}</div><div class="example-cn">${w.exCn}</div>`;
  document.getElementById('answer-reveal').style.display = 'block';
  document.getElementById('action-row').style.display = 'flex';
}

function nextStudy() {
  currentIdx++;
  renderStudy();
}

function renderRead() {
  if (currentIdx >= currentWords.length) { 
    alert('本组单词文本浏览完成！');
    showScreen('home');
    buildHome(); 
    return; 
  }
  const w = currentWords[currentIdx];
  document.getElementById('read-pos').textContent = w.pos;
  document.getElementById('read-en').textContent = w.en;
  document.getElementById('read-phonetic').textContent = w.phonetic || '(暂无音标)';
  document.getElementById('read-cn').textContent = w.cn;
  document.getElementById('read-example').innerHTML = `<div class="example-en">${w.exEn}</div><div class="example-cn">${w.exCn}</div>`;
  document.getElementById('read-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('read-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';

  const imgKey = getImgKey(w.en);
  let url = `https://res.cloudinary.com/dcuw9ijyx/image/upload/${imgKey}.jpg`;
  
  const readImageZone = document.getElementById('read-image');
  readImageZone.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:contain;" id="read-img-element">`;
  
  const imgEl = document.getElementById('read-img-element');
  imgEl.onerror = function () {
    readImageZone.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--accent);font-size:13px;background:#FCFAF6;">⚠️ 暂无对应图片 (${imgKey}.jpg)</div>`;
  };
}

function prevRead() { if (currentIdx > 0) { currentIdx--; renderRead(); } }
function nextRead() { currentIdx++; renderRead(); }

function speak() {
  const w = currentWords[currentIdx];
  const u = new SpeechSynthesisUtterance(w.en);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

renderBookShelf();
buildHome();
</script>
