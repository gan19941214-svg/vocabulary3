
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WAKE 的书库</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: #F0F5F5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== TOP BAR ===== */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: #FFFFFF;
  padding: 12px 16px;
  border-bottom: 1px solid #E8EEEE;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.topbar-logo { font-size: 17px; font-weight: 700; color: #1A2E2E; letter-spacing: 0.3px; }
.topbar-streak { background: #D4EEEE; border-radius: 20px; padding: 4px 12px; font-size: 13px; color: #2A7878; font-weight: 600; }

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: block; }

/* ===== BOOKSHELF SCREEN ===== */
#screen-bookshelf { padding: 16px; max-width: 480px; margin: 0 auto; }
.home-header {
  background: #FFFFFF;
  border-radius: 14px;
  padding: 24px 16px 20px;
  margin-bottom: 18px;
  text-align: center;
  border: 1px solid #E4EEEE;
}
.home-title { font-size: 22px; font-weight: 700; color: #2A7878; }
.home-desc { font-size: 13px; color: #6A8A8A; margin-top: 5px; }
.bookshelf-container { overflow-x: auto; padding: 4px 0 16px; -webkit-overflow-scrolling: touch; }
.bookshelf-container::-webkit-scrollbar { display: none; }
.bookshelf { display: flex; gap: 14px; padding: 0 16px; }
.book-card {
  width: 170px; flex-shrink: 0;
  background: #FFFFFF;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  border: 1px solid #E8EEEE;
  cursor: pointer;
  transition: transform 0.15s;
}
.book-card:active { transform: scale(0.97); }
.book-cover { width: 100%; height: 220px; object-fit: cover; display: block; }
.book-info { padding: 10px 12px 12px; }
.book-title { font-size: 14px; font-weight: 600; color: #1A2E2E; }
.book-desc { font-size: 12px; color: #6A8A8A; margin-top: 3px; }
.add-book-card {
  width: 170px; height: 274px; flex-shrink: 0;
  background: #FFFFFF;
  border: 2px dashed #C8DEDE;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #8AABAB; cursor: pointer;
}
.add-icon { font-size: 36px; margin-bottom: 6px; }
.add-text { font-size: 13px; }

/* ===== DIRECTORY SCREEN (HOME) ===== */
#screen-home { max-width: 480px; margin: 0 auto; padding-bottom: 24px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  color: #6A8A8A; font-size: 14px; cursor: pointer;
  padding: 12px 16px 8px;
}
.back-btn:active { opacity: 0.6; }

/* ===== CHAPTER BLOCK ===== */
.chapter-block { margin-bottom: 2px; }
.chapter-header-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
}
.chapter-header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.chapter-num-tag {
  font-size: 11px; font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap; flex-shrink: 0;
  color: #FFFFFF;
  letter-spacing: 0.5px;
}
.chapter-title-wrap { min-width: 0; }
.chapter-en { font-size: 15px; font-weight: 700; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-cn { font-size: 11px; color: rgba(255,255,255,0.82); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-chevron { font-size: 12px; color: rgba(255,255,255,0.8); flex-shrink: 0; transition: transform 0.2s; margin-left: 8px; }
.chapter-chevron.open { transform: rotate(180deg); }

/* ===== UNIT ROWS ===== */
.unit-list-wrap { display: none; }
.unit-list-wrap.open { display: block; }

.unit-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px;
  cursor: pointer;
  transition: filter 0.15s;
}
.unit-row:active { filter: brightness(0.94); }
.unit-row-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.unit-seq { font-size: 11px; font-weight: 700; color: inherit; opacity: 0.55; white-space: nowrap; flex-shrink: 0; }
.unit-info { min-width: 0; }
.unit-en { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.unit-cn { font-size: 12px; font-weight: 400; margin-top: 1px; opacity: 0.62; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.parts-badge {
  font-size: 11px; font-weight: 600;
  padding: 3px 9px; border-radius: 999px;
  white-space: nowrap; flex-shrink: 0;
  background: rgba(0,0,0,0.06);
  color: inherit;
  opacity: 0.75;
}

/* ===== ARTICLE BLOCKS (Part Grid) ===== */
.articles-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
  padding: 4px 12px 10px;
}
.article-block {
  height: 30px;
  border-radius: 5px;
  display: flex; align-items: center;
  padding: 0 8px;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  transition: filter 0.12s;
}
.article-block:active { filter: brightness(0.90); }
.article-block-inner {
  display: flex; align-items: center; gap: 5px;
  overflow: hidden; min-width: 0; width: 100%;
}
.article-part { font-size: 11px; font-weight: 700; flex-shrink: 0; }
.article-cn-label { font-size: 11px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }

/* ===== MODE SCREEN ===== */
#screen-mode { max-width: 480px; margin: 0 auto; padding: 0 16px 24px; }
.mode-header-card {
  background: #FFFFFF; border-radius: 14px;
  border: 1px solid #E4EEEE;
  padding: 16px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.mode-header-icon { width: 46px; height: 46px; background: #D4EEEE; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.mode-header h2 { font-size: 16px; font-weight: 700; color: #1A2E2E; }
.mode-header p { font-size: 12px; color: #6A8A8A; margin-top: 2px; }
.mode-card {
  background: #FFFFFF; border-radius: 12px;
  border: 1px solid #E4EEEE;
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: all 0.15s;
}
.mode-card:active { transform: translateY(1px); }
.mode-card-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.mode-card-icon.study { background: #D4EEEE; }
.mode-card-icon.read { background: #FFF3B0; }
.mode-card h3 { font-size: 15px; font-weight: 600; color: #1A2E2E; }
.mode-card p { font-size: 12px; color: #6A8A8A; margin-top: 1px; }

/* ===== STUDY & READ SCREENS ===== */
#screen-study, #screen-read { max-width: 480px; margin: 0 auto; padding: 0 16px 24px; }
.progress-area { margin-bottom: 14px; }
.progress-top { display: flex; justify-content: space-between; font-size: 12px; color: #6A8A8A; margin-bottom: 6px; }
.progress-bar { height: 5px; background: #E4EEEE; border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: #4AA8B8; border-radius: 99px; transition: width 0.3s; }
.word-card { background: #FFFFFF; border-radius: 18px; border: 1px solid #E4EEEE; overflow: hidden; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.word-card-top { padding: 20px; text-align: center; }
.word-pos-badge { display: inline-block; background: #D4EEEE; color: #2A8A8A; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 7px; margin-bottom: 10px; }
.word-cn { font-size: 28px; font-weight: 700; color: #1A2E2E; margin-bottom: 6px; }
.image-zone { height: 170px; background: #EEF6F6; overflow: hidden; }
.image-zone img { width: 100%; height: 100%; object-fit: contain; display: block; }
.word-card-bottom { padding: 16px 20px; }
.input-label { font-size: 12px; color: #6A8A8A; margin-bottom: 6px; }
.word-input { width: 100%; padding: 10px 14px; border: 1px solid #D4E8E8; border-radius: 10px; background: #F4FAFA; margin-bottom: 10px; font-size: 16px; color: #1A2E2E; outline: none; }
.word-input:focus { border-color: #4AA8B8; }
.submit-btn { width: 100%; padding: 11px; background: #4AA8B8; color: #fff; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
.result-row { padding: 10px 12px; border-radius: 10px; font-weight: 500; display: none; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }
.result-row.correct { background: #D8F0EB; color: #3A9E8A; display: flex; }
.result-row.wrong { background: #FDEAEA; color: #C05050; display: flex; }
.answer-reveal { display: none; margin-top: 12px; }
.answer-en { font-size: 22px; font-weight: 700; color: #1A2E2E; margin-bottom: 3px; }
.answer-phonetic { font-size: 13px; color: #6A8A8A; margin-bottom: 10px; }
.answer-sound-btn { background: #D4EEEE; color: #2A8A8A; border: none; border-radius: 7px; padding: 5px 12px; margin-bottom: 10px; cursor: pointer; font-size: 13px; }
.example-box { background: #EEF6F6; border-radius: 10px; padding: 12px; border-left: 3px solid #4AA8B8; font-size: 13px; line-height: 1.6; color: #2A4040; }
.action-row { display: flex; gap: 8px; margin-top: 12px; }
.action-btn { flex: 1; padding: 11px; border-radius: 10px; font-weight: 600; border: 1px solid #E4EEEE; background: #FFFFFF; cursor: pointer; font-size: 14px; color: #1A2E2E; }
.action-btn.primary { background: #4AA8B8; color: #fff; border-color: #4AA8B8; }
.read-card { background: #FFFFFF; border-radius: 18px; border: 1px solid #E4EEEE; padding: 18px; margin-bottom: 12px; }
.read-image { width: 100%; height: 170px; background: #EEF6F6; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.read-image img { width: 100%; height: 100%; object-fit: contain; }
.read-pos { font-size: 12px; color: #6A8A8A; margin-bottom: 3px; }
.read-en { font-size: 24px; font-weight: 700; color: #1A2E2E; margin-bottom: 3px; }
.read-phonetic { font-size: 13px; color: #6A8A8A; margin-bottom: 8px; }
.read-cn { font-size: 18px; font-weight: 600; color: #1A2E2E; margin-bottom: 12px; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(30,40,40,0.88); color: #fff;
  padding: 10px 20px; border-radius: 22px;
  font-size: 13px; white-space: nowrap;
  z-index: 999; opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== MODAL ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center; z-index: 998;
}
.modal-box {
  width: 85%; max-width: 360px;
  background: #FFFFFF; border-radius: 16px; padding: 24px;
}
.modal-title { font-size: 17px; font-weight: 700; color: #1A2E2E; text-align: center; margin-bottom: 16px; }
.modal-input { width: 100%; padding: 11px 14px; border: 1px solid #D4E8E8; border-radius: 10px; margin-bottom: 18px; background: #F4FAFA; font-size: 15px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn-cancel { background: #EFEFEF; color: #666; }
.btn-confirm { background: #4AA8B8; color: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">WAKE 的书库</div>
  <div class="topbar-streak">连续 <span id="streak-num">0</span> 天</div>
</div>

<!-- 书架 -->
<div class="screen active" id="screen-bookshelf">
  <div style="padding:16px; max-width:480px; margin:0 auto;">
    <div class="home-header">
      <div class="home-title">WAKE 的书库</div>
      <div class="home-desc">此人职业生涯就要爆发了</div>
    </div>
    <div class="bookshelf-container">
      <div class="bookshelf" id="bookshelf"></div>
    </div>
  </div>
</div>

<!-- 目录 -->
<div class="screen" id="screen-home">
  <div style="max-width:480px; margin:0 auto;">
    <div class="back-btn" onclick="goBackBookcase()">
      ← 返回我的书库
    </div>
    <div id="chapter-list"></div>
  </div>
</div>

<!-- 模式选择 -->
<div class="screen" id="screen-mode">
  <div style="max-width:480px; margin:0 auto; padding:0 16px 24px;">
    <div class="back-btn" onclick="showScreen('home')" style="padding-left:0;">← 返回目录</div>
    <div class="mode-header-card">
      <div class="mode-header-icon">📖</div>
      <div>
        <h2 id="mode-unit-name">Unit</h2>
        <p id="mode-unit-sub">Loading...</p>
      </div>
    </div>
    <div class="mode-card" onclick="startMode('study')">
      <div class="mode-card-icon study">✏️</div>
      <div><h3>看图默写</h3><p>看中文+图片默写，深度记忆</p></div>
    </div>
    <div class="mode-card" onclick="startMode('read')">
      <div class="mode-card-icon read">📚</div>
      <div><h3>文本学习</h3><p>单词+图片+例句，全面复习</p></div>
    </div>
  </div>
</div>

<!-- 默写模式 -->
<div class="screen" id="screen-study">
  <div style="max-width:480px; margin:0 auto; padding:0 16px 24px;">
    <div class="back-btn" onclick="showScreen('mode')" style="padding-left:0;">← 返回</div>
    <div class="progress-area">
      <div class="progress-top"><span id="study-progress-label">1 / 24</span></div>
      <div class="progress-bar"><div class="progress-fill" id="study-progress-fill"></div></div>
    </div>
    <div class="word-card">
      <div class="word-card-top">
        <div class="word-pos-badge" id="study-pos">n.</div>
        <div class="word-cn" id="study-cn">腮红</div>
      </div>
      <div class="image-zone" id="study-image-zone"></div>
      <div class="word-card-bottom">
        <div class="input-label">默写英文：</div>
        <input class="word-input" id="study-input" placeholder="输入单词..." autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button class="submit-btn" onclick="checkStudy()">确认</button>
        <div class="result-row" id="study-result"></div>
        <div class="answer-reveal" id="answer-reveal">
          <div class="answer-en" id="answer-en"></div>
          <div class="answer-phonetic" id="answer-phonetic"></div>
          <button class="answer-sound-btn" onclick="speak()">🔊 发音</button>
          <div class="example-box" id="example-box"></div>
        </div>
        <div class="action-row" id="action-row" style="display:none;">
          <button class="action-btn primary" onclick="nextStudy()">下一个 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 阅读模式 -->
<div class="screen" id="screen-read">
  <div style="max-width:480px; margin:0 auto; padding:0 16px 24px;">
    <div class="back-btn" onclick="showScreen('mode')" style="padding-left:0;">← 返回</div>
    <div class="progress-area">
      <div class="progress-top"><span id="read-progress-label">1 / 24</span></div>
      <div class="progress-bar"><div class="progress-fill" id="read-progress-fill"></div></div>
    </div>
    <div class="read-card">
      <div class="read-image" id="read-image"></div>
      <div class="read-pos" id="read-pos">n.</div>
      <div class="read-en" id="read-en">blush</div>
      <div class="read-phonetic" id="read-phonetic">[blʌʃ]</div>
      <div class="read-cn" id="read-cn">腮红</div>
      <div class="example-box" id="read-example"></div>
    </div>
    <div class="action-row">
      <button class="action-btn" onclick="prevRead()">← 上一个</button>
      <button class="action-btn primary" onclick="nextRead()">下一个 →</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 添加书籍弹窗 -->
<div class="modal-mask" id="addModal">
  <div class="modal-box">
    <div class="modal-title">添加新单词书</div>
    <input type="text" class="modal-input" id="newBookName" placeholder="请输入书籍名称">
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn btn-confirm" onclick="confirmAddBook()">确定</button>
    </div>
  </div>
</div>

function openModal() {

  document.getElementById('newBookName').value = '';
}

function confirmAddBook() {
  const name = document.getElementById('newBookName').value.trim();

  bookList.push({ name });
  try { localStorage.setItem('wakeBookList', JSON.stringify(bookList)); } catch(e) {}
  renderBookShelf();
  closeModal();
}

  selectedBook = bookList[idx].name;

}

/* =============================================
   目录页构建（完整9章骨架 + 三级目录）
   ============================================= */
function buildHome() {
  document.getElementById('streak-num').textContent = streak;
  const container = document.getElementById('chapter-list');
  let html = '';

  bookDirectoryGrid.forEach((chData, chIdx) => {
    const theme = chapterThemes[chData.chapter];
    html += `
      <div class="chapter-block" id="ch-block-${chData.chapter}">
        <div class="chapter-header-bar" style="background:${theme.primary};" onclick="toggleChapter(${chData.chapter})">
          <div class="chapter-header-left">
            <span class="chapter-num-tag" style="background:rgba(255,255,255,0.22); color:#fff;">Ch ${chData.chapter}</span>
            <div class="chapter-title-wrap">
              <div class="chapter-en">${chData.title}</div>
              <div class="chapter-cn">${chData.cn}</div>
            </div>
          </div>
          <span class="chapter-chevron" id="chevron-${chData.chapter}">▼</span>
        </div>
        <div class="unit-list-wrap" id="unit-wrap-${chData.chapter}">`;

    chData.units.forEach((unitData, unitIdx) => {
      const isOdd = (unitIdx % 2 === 0);
      const rowBg = isOdd ? theme.unitOdd : '#FAFAFA';
      const rowText = theme.text;

      html += `
          <div class="unit-row" style="background:${rowBg};" onclick="toggleArticles(${chData.chapter}, ${unitIdx})">
            <div class="unit-row-left">
              <span class="unit-seq" style="color:${rowText};">${unitData.unit}</span>
              <div class="unit-info">
                <div class="unit-en" style="color:${rowText};">${unitData.en}</div>
                <div class="unit-cn" style="color:${rowText};">${unitData.cn}</div>
              </div>
            </div>
            <span class="parts-badge" style="color:${rowText};">3 Parts</span>
          </div>
          <div id="articles-${chData.chapter}-${unitIdx}" style="display:none; background:${rowBg};">
            <div class="articles-grid">`;

      unitData.articles.forEach(article => {
        const hasWords = WORDS.some(w => w.articleId === article.id);
        html += `
              <div class="article-block" style="background:${theme.tag};" onclick="clickArticle('${article.id}', '${article.title} ${article.cn}')">
                <div class="article-block-inner">
                  <span class="article-part" style="color:${theme.text};">${article.title}</span>
                  <span class="article-cn-label" style="color:${theme.text};">${article.cn}</span>
                </div>
              </div>`;
      });

      html += `
            </div>
          </div>`;
    });

    html += `
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

function toggleChapter(chNum) {
  const wrap = document.getElementById(`unit-wrap-${chNum}`);
  const chevron = document.getElementById(`chevron-${chNum}`);
  const isOpen = wrap.classList.toggle('open');
  chevron.classList.toggle('open', isOpen);
}

function toggleArticles(chNum, unitIdx) {
  const el = document.getElementById(`articles-${chNum}-${unitIdx}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function clickArticle(articleId, articleTitle) {
  const words = WORDS.filter(w => w.articleId === articleId);
  if (words.length === 0) {
    showToast('该篇章词汇正在整备中，敬请期待...');
    return;
  }
  selectedArticleId = articleId;
  selectedArticleTitle = articleTitle;
  document.getElementById('mode-unit-name').textContent = articleTitle;
  document.getElementById('mode-unit-sub').textContent = words.length + ' 个单词';
  showScreen('mode');
}

/* =============================================
   学习模式
   ============================================= */
function startMode(mode) {
  currentIdx = 0;
  currentWords = WORDS.filter(w => w.articleId === selectedArticleId);
  if (mode === 'study') { showScreen('study'); renderStudy(); }
  else if (mode === 'read') { showScreen('read'); renderRead(); }
}

function getImgKey(word) {
  return word.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}

function renderStudy() {
  if (currentIdx >= currentWords.length) {
    showToast('本篇章学习完成！🎉');
    showScreen('home');
    return;
  }
  const w = currentWords[currentIdx];
  document.getElementById('study-pos').textContent = w.pos;
  document.getElementById('study-cn').textContent = w.cn;
  document.getElementById('study-input').value = '';
  document.getElementById('study-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('study-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
  document.getElementById('answer-reveal').style.display = 'none';
  document.getElementById('action-row').style.display = 'none';
  document.getElementById('study-result').style.display = 'none';
  const zone = document.getElementById('study-image-zone');
  const imgKey = getImgKey(w.en);
  zone.innerHTML = `<img src="https://res.cloudinary.com/dcuw9ijyx/image/upload/${imgKey}.jpg" style="width:100%;height:100%;object-fit:contain;display:block;" onerror="this.parentNode.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;color:#6A8A8A;font-size:13px;\'>暂无对应图片</div>'">`;
}

function checkStudy() {
  const w = currentWords[currentIdx];
  const input = document.getElementById('study-input').value.trim().toLowerCase().replace(/[!]/g, '');
  const answer = w.en.toLowerCase().replace(/[!]/g, '');
  const correct = input === answer;
  const resultEl = document.getElementById('study-result');
  if (correct) {
    resultEl.className = 'result-row correct';
    resultEl.innerHTML = '✅ 回答正确！';
    if (!learnedWords.includes(w.en)) {
      learnedWords.push(w.en);
      try { localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); } catch(e) {}
    }
  } else {
    resultEl.className = 'result-row wrong';
    resultEl.innerHTML = `❌ 正确答案：${w.en}`;
  }
  resultEl.style.display = 'flex';
  document.getElementById('answer-en').textContent = w.en;
  document.getElementById('answer-phonetic').textContent = w.phonetic || '（暂无音标）';
  document.getElementById('example-box').innerHTML = `<div>${w.exEn}</div><div style="margin-top:4px;opacity:0.75;">${w.exCn}</div>`;
  document.getElementById('answer-reveal').style.display = 'block';
  document.getElementById('action-row').style.display = 'flex';
}
function nextStudy() { currentIdx++; renderStudy(); }

function renderRead() {
  if (currentIdx >= currentWords.length) {
    showToast('本篇章学习完成！🎉');
    showScreen('home');
    return;
  }
  const w = currentWords[currentIdx];
  document.getElementById('read-pos').textContent = w.pos;
  document.getElementById('read-en').textContent = w.en;
  document.getElementById('read-phonetic').textContent = w.phonetic || '（暂无音标）';
  document.getElementById('read-cn').textContent = w.cn;
  document.getElementById('read-example').innerHTML = `<div>${w.exEn}</div><div style="margin-top:4px;opacity:0.75;">${w.exCn}</div>`;
  document.getElementById('read-progress-label').textContent = (currentIdx + 1) + ' / ' + currentWords.length;
  document.getElementById('read-progress-fill').style.width = (currentIdx / currentWords.length * 100) + '%';
  const zone = document.getElementById('read-image');
  const imgKey = getImgKey(w.en);
  zone.innerHTML = `<img src="https://res.cloudinary.com/dcuw9ijyx/image/upload/${imgKey}.jpg" style="width:100%;height:100%;object-fit:contain;" onerror="this.parentNode.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;color:#6A8A8A;font-size:13px;\'>暂无对应图片</div>'">`;
}
function prevRead() { if (currentIdx > 0) { currentIdx--; renderRead(); } }
function nextRead() { currentIdx++; renderRead(); }

function speak() {
  const w = currentWords[currentIdx];
  if (!w) return;
  const u = new SpeechSynthesisUtterance(w.en);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

/* =============================================
   Utils
   ============================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

/* =============================================
   Init
   ============================================= */
renderBookShelf();
buildHome();
</script>
</body>
</html>
